name: Profile assets

# Rebuilds the animated CP rating graphs and badges and the GitHub stats,
# languages and contribution cards (public + private, via STATS_TOKEN),
# then publishes them to the `output` branch.
on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Last good output, used as a fallback if a CP site is unreachable
      - name: Fetch previous output
        run: |
          git clone --depth 1 --branch output \
            "https://github.com/${{ github.repository }}.git" prev || mkdir -p prev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build CP rating graphs and badges
        run: python scripts/cp_graphs.py --out dist --prev prev

      - name: Build GitHub stats and top-languages cards
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/github_stats.py --user thehav0k --out dist --prev prev

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
